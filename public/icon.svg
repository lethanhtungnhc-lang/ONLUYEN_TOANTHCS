<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Cosmic Sapphire Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f29" />
      <stop offset="25%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="90%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Pi Golden-Cyan Metallic Shimmer -->
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#e0f2fe" />
      <stop offset="85%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Warm Gold Gradient for Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Badge Ribbon Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="30%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Multi-layer Soft Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="piGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Rounded Icon Base with Squircle Smooth Radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Ambient Border Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" />

  <!-- Sacred Mathematical Geometry Background Rings -->
  <!-- Polar coordinate circular grid & Golden Spiral nodes -->
  <circle cx="256" cy="228" r="195" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="256" cy="228" r="162" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="2.5" stroke-dasharray="14 10" />
  <circle cx="256" cy="228" r="128" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <circle cx="256" cy="228" r="88" fill="none" stroke="rgba(245,158,11,0.12)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Coordinate Crosshairs & Golden Ratio Ticks -->
  <line x1="256" y1="40" x2="256" y2="416" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="68" y1="228" x2="444" y2="228" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Orbiting Cardinal Math Sparkles -->
  <circle cx="256" cy="33" r="4.5" fill="#38bdf8" />
  <circle cx="451" cy="228" r="4.5" fill="#38bdf8" />
  <circle cx="61" cy="228" r="4.5" fill="#38bdf8" />
  <circle cx="395" cy="89" r="3.5" fill="#facc15" />
  <circle cx="117" cy="367" r="3.5" fill="#facc15" />

  <!-- ======================================================== -->
  <!-- ARTISTIC MATHEMATICAL PI (π) SYMBOL VECTOR               -->
  <!-- ======================================================== -->
  <g filter="url(#piGlow)">
    <!-- Elegant Serif Mathematical Pi Symbol Vector Curves -->
    <path d="M 120 162 
             C 134 162, 156 158, 174 147 
             C 196 134, 218 130, 264 130 
             L 358 130 
             C 382 130, 396 136, 404 150 
             C 408 160, 402 170, 390 170 
             C 378 170, 368 162, 350 162 
             L 326 162 
             L 326 288 
             C 326 316, 330 332, 344 338 
             C 356 342, 368 338, 378 320 
             C 384 310, 392 312, 392 320 
             C 392 340, 368 360, 336 360 
             C 302 360, 288 336, 288 292 
             L 288 162 
             L 218 162 
             L 218 302 
             C 218 334, 212 350, 192 356 
             C 174 360, 158 350, 146 338 
             C 138 330, 142 322, 150 322 
             C 162 322, 178 328, 184 308 
             L 184 162 
             L 132 162 
             C 120 162, 114 154, 118 148 
             Z" 
          fill="url(#piGrad)" />

    <!-- Pure Serif Pi Typography Accent for Maximum Crispness & Distinction -->
    <text x="256" y="306" 
          font-family="'Cambria Math', 'Times New Roman', 'DejaVu Serif', serif" 
          font-size="246" 
          font-weight="bold" 
          fill="url(#piGrad)" 
          text-anchor="middle" 
          letter-spacing="-4"
          opacity="0.98">π</text>
  </g>

  <!-- Golden Starlight Sparkles -->
  <g transform="translate(390, 96)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>
  <g transform="translate(122, 252) scale(0.65)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- ======================================================== -->
  <!-- HIGH-AESTHETIC BOTTOM BADGE: "ToánTHCS"                  -->
  <!-- ======================================================== -->
  <g transform="translate(256, 436)" filter="url(#softGlow)">
    <!-- Badge Container with Glass Border -->
    <rect x="-160" y="-32" width="320" height="60" rx="30" 
          fill="url(#badgeGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="2.5" />

    <!-- Inner Glow Accent -->
    <rect x="-156" y="-28" width="312" height="52" rx="26" 
          fill="none" 
          stroke="rgba(56,189,248,0.4)" 
          stroke-width="1.2" />

    <!-- Left & Right Diamond Accents -->
    <polygon points="-132,-2 -138,5 -144,-2 -138,-9" fill="#facc15" />
    <polygon points="132,-2 138,5 144,-2 138,-9" fill="#facc15" />

    <!-- Sharp, Ultra-Clear "ToánTHCS" Typography -->
    <text x="0" y="8" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          text-anchor="middle" 
          letter-spacing="2">ToánTHCS</text>
  </g>
</svg>
