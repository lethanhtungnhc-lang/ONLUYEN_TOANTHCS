<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Mathematical Geometry Background Rings -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="1.5" />

  <!-- Four Quadrant Accent Dots -->
  <circle cx="256" cy="40" r="4" fill="#38bdf8" />
  <circle cx="472" cy="256" r="4" fill="#38bdf8" />
  <circle cx="256" cy="472" r="4" fill="#38bdf8" />
  <circle cx="40" cy="256" r="4" fill="#38bdf8" />

  <!-- MATHEMATICAL PI (π) SYMBOL VECTOR PATH -->
  <g filter="url(#glow)">
    <!-- Pi Symbol Precision Mathematical Curves -->
    <!-- Horizontal Crossbar with elegant serif curves -->
    <path d="M 125 186 C 138 186 160 182 176 172 C 196 160 216 156 260 156 L 358 156 C 378 156 392 160 398 174 C 402 184 398 194 386 194 C 376 194 366 186 352 186 L 322 186 L 322 308 C 322 334 326 348 338 354 C 348 358 360 354 370 338 C 376 328 384 330 384 338 C 384 354 362 374 334 374 C 304 374 290 352 290 312 L 290 186 L 222 186 L 222 322 C 222 352 216 366 198 370 C 182 374 168 366 158 354 C 150 346 154 338 162 338 C 172 338 188 344 192 326 L 192 186 L 138 186 C 128 186 122 180 125 174 Z" fill="url(#piGrad)" />

    <!-- Stylized Pi Letter Fallback Overlay for Crisp Unicode Readability -->
    <text x="256" y="328" font-family="'Times New Roman', 'Cambria Math', 'DejaVu Serif', serif" font-size="240" font-weight="bold" fill="url(#piGrad)" text-anchor="middle" font-style="normal" opacity="0.95">π</text>
  </g>

  <!-- Golden Ratio Sparkle (Top-Right) -->
  <g transform="translate(378, 120)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
  <g transform="translate(132, 280) scale(0.6)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#goldGrad)" opacity="0.8" />
  </g>

  <!-- Bottom App Label Badge -->
  <g transform="translate(256, 436)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#0f172a" fill-opacity="0.88" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" />
    <text x="0" y="7" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="3">TOÁN THCS</text>
  </g>
</svg>
